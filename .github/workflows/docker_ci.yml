name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    name: Go 1.24.9 and release package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify production source and publication inputs
        run: |
          python scripts/verify_production_source.py
          python scripts/secret_scan.py
          go mod verify
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...
      - name: Package committed source
        run: |
          python scripts/package_release.py --version v1.0.0
          python scripts/verify_release.py dist
          tar -xzf dist/pansou-v1.0.0-linux-amd64.tar.gz -C dist
          python scripts/smoke_release.py dist/pansou-v1.0.0-linux-amd64/bin/pansou
      - uses: actions/upload-artifact@v4
        with:
          name: pansou-linux-amd64-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/PROVENANCE.json
            dist/SHA256SUMS
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: pansou:ci
